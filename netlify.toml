[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"


# One canonical domain: internethealthsite.com. Every other host 301s to the same path there.
[[redirects]]
  from = "https://www.internethealthsite.com/*"
  to = "https://internethealthsite.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.internethealthsite.com/*"
  to = "https://internethealthsite.com/:splat"
  status = 301
  force = true

